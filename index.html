
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>증시 캘린더</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>증시 캘린더</h1>
    </header>
    <main>
        <div class="filter-container">
            <div class="country-filter">
                <label><input type="radio" name="country" value="korea" checked> 한국</label>
                <label><input type="radio" name="country" value="usa"> 미국</label>
            </div>
            <div class="event-type-filter">
                <label><input type="checkbox" name="event-type" value="holiday" checked> 휴장일</label>
                <label><input type="checkbox" name="event-type" value="economic-indicator" checked> 경제 지표</label>
                <label><input type="checkbox" name="event-type" value="economic-meeting"> 경제 회의</label>
                <label><input type="checkbox" name="event-type" value="earnings-report"> 실적</label>
                <label><input type="checkbox" name="event-type" value="futures-options-expiration"> 선물옵션 만기일</label>
                <label><input type="checkbox" name="event-type" value="seminar-exhibition"> 주가 관련 세미나 및 전시회</label>
                <label><input type="checkbox" name="event-type" value="other"> 기타</label>
            </div>
            <button id="apply-filters">적용</button>
        </div>

        <div class="calendar-views">
            <section id="monthly-view">
                <h2>월간 캘린더</h2>
                <div class="calendar-header">
                    <button id="prev-month">&lt;</button>
                    <h3 id="monthly-view-title"></h3>
                    <button id="next-month">&gt;</button>
                </div>
                <div id="monthly-calendar" class="calendar"></div>
            </section>

            <section id="weekly-view">
                <h2>주간 캘린더</h2>
                 <div class="calendar-header">
                    <button id="prev-week">&lt;</button>
                    <h3 id="weekly-view-title"></h3>
                    <button id="next-week">&gt;</button>
                </div>
                <div id="weekly-calendar" class="calendar"></div>
            </section>
        </div>
    </main>

    <div id="modal-backdrop" class="hidden"></div>
    <div id="impact-analysis-modal" class="modal hidden">
        <div class="modal-header">
            <h2>영향 분석</h2>
            <button id="close-modal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-content-item">
                <h4>상승 요인</h4>
                <p id="bullish-factors"></p>
            </div>
            <div class="modal-content-item">
                <h4>하락 요인</h4>
                <p id="bearish-factors"></p>
            </div>
        </div>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
