<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Calendar Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <h1>STOCK CALENDAR</h1>
            </div>
            <div class="view-controls">
                <button id="btn-monthly" class="active">월간</button>
                <button id="btn-weekly">주간</button>
                <button id="btn-list">목록</button>
                <button id="theme-toggle" class="nav-btn" title="테마 변경" style="margin-left: 12px;">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <aside class="filter-sidebar">
            <section class="filter-group">
                <h3><i class="fas fa-globe"></i> 시장 선택</h3>
                <div class="radio-group">
                    <label class="custom-radio">
                        <input type="radio" name="country" value="korea" checked>
                        <span class="radio-mark"></span> 국내 증시
                    </label>
                    <label class="custom-radio">
                        <input type="radio" name="country" value="usa">
                        <span class="radio-mark"></span> 미국 증시
                    </label>
                </div>
            </section>

            <section class="filter-group">
                <h3><i class="fas fa-tags"></i> 일정 구분</h3>
                <div class="checkbox-grid">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="event-type" value="ipo" checked>
                        <span class="check-mark"></span> 공모주
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="event-type" value="dividend" checked>
                        <span class="check-mark"></span> 배당
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="event-type" value="earnings" checked>
                        <span class="check-mark"></span> 실적
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="event-type" value="economic" checked>
                        <span class="check-mark"></span> 경제지표
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="event-type" value="rights" checked>
                        <span class="check-mark"></span> 증자/권리
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="event-type" value="holiday">
                        <span class="check-mark"></span> 휴장일
                    </label>
                </div>
            </section>
            
            <button id="apply-filters" class="primary-btn">필터 적용</button>
            <button id="reset-filters" class="secondary-btn" style="width: 100%; margin-top: 12px; height: 44px;">초기화</button>
        </aside>

        <main class="content-area">
            <div class="calendar-wrapper">
                <div class="calendar-nav">
                    <button id="prev-period" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="view-title">2024년 7월</h2>
                    <button id="next-period" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
                    <button id="today-btn" class="secondary-btn">오늘</button>
                </div>
                
                <div id="calendar-container">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </main>
    </div>

    <!-- Details Modal -->
    <div id="modal-backdrop" class="hidden"></div>
    <div id="event-modal" class="modal hidden">
        <div class="modal-header">
            <h2 id="modal-title">상세 일정</h2>
            <button id="close-modal">&times;</button>
        </div>
        <div class="modal-body">
            <div id="modal-content"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="main.js" type="module"></script>
</body>
</html>
